<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Windows 11 Web Desktop</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Рабочий стол -->
    <div id="desktop" class="desktop">
        <!-- Рабочие иконки -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-app="trash" tabindex="0">
                <div class="icon-img"><i class="fas fa-trash-alt"></i></div>
                <span>Корзина</span>
            </div>
            <div class="desktop-icon" data-app="computer" tabindex="0">
                <div class="icon-img"><i class="fas fa-desktop"></i></div>
                <span>Этот компьютер</span>
            </div>
            <div class="desktop-icon" data-app="documents" tabindex="0">
                <div class="icon-img"><i class="fas fa-folder-open"></i></div>
                <span>Документы</span>
            </div>
        </div>

        <!-- Контейнер для открытых окон -->
        <div id="windows-container"></div>

        <!-- Контекстное меню (скрыто по умолчанию) -->
        <div id="context-menu" class="context-menu hidden">
            <div class="context-item" data-action="refresh"><i class="fas fa-sync-alt"></i> Обновить</div>
            <div class="context-item" data-action="new-folder"><i class="fas fa-folder-plus"></i> Создать папку</div>
            <div class="context-item" data-action="display-settings"><i class="fas fa-sliders-h"></i> Параметры экрана</div>
            <div class="context-item" data-action="personalize"><i class="fas fa-paint-brush"></i> Персонализация</div>
        </div>
    </div>

    <!-- Меню Пуск -->
    <div id="start-menu" class="start-menu hidden">
        <div class="start-header">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="start-search" placeholder="Поиск приложений...">
            </div>
        </div>
        <div class="start-content">
            <div class="pinned-apps">
                <h3>Закрепленные</h3>
                <div class="app-grid" id="pinned-grid">
                    <!-- Закрепленные приложения добавляются через JS -->
                </div>
            </div>
            <div class="all-apps-section">
                <h3>Все приложения</h3>
                <div class="all-apps-list" id="all-apps-list">
                    <!-- Список всех приложений добавляется через JS -->
                </div>
            </div>
        </div>
        <div class="start-footer">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span>Пользователь</span>
            </div>
            <div class="power-btn" id="power-btn">
                <i class="fas fa-power-off"></i>
            </div>
        </div>
    </div>

    <!-- Панель задач -->
    <div id="taskbar" class="taskbar">
        <div class="taskbar-left">
            <!-- Кнопка Пуск -->
            <button id="start-btn" class="start-btn" aria-label="Пуск">
                <i class="fab fa-windows"></i>
            </button>
            <!-- Иконки приложений на панели задач (быстрый доступ) -->
            <div class="taskbar-apps" id="taskbar-apps">
                <button class="taskbar-app" data-app="explorer" title="Проводник">
                    <i class="fas fa-folder"></i>
                </button>
                <button class="taskbar-app" data-app="edge" title="Microsoft Edge">
                    <i class="fab fa-edge"></i>
                </button>
                <button class="taskbar-app" data-app="settings" title="Настройки">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="taskbar-app" data-app="store" title="Магазин">
                    <i class="fas fa-store"></i>
                </button>
            </div>
        </div>
        <div class="taskbar-right">
            <!-- Системный трей -->
            <div class="system-tray">
                <div class="tray-icons">
                    <i class="fas fa-volume-up" title="Звук"></i>
                    <i class="fas fa-wifi" title="Сеть"></i>
                    <i class="fas fa-battery-full" title="Батарея"></i>
                </div>
                <div class="clock" id="clock">
                    <div class="time" id="time">12:00</div>
                    <div class="date" id="date">01.01.2025</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Шаблон окна (используется для создания новых окон) -->
    <template id="window-template">
        <div class="window" style="width: 600px; height: 400px; top: 100px; left: 100px;">
            <div class="window-header">
                <div class="window-title"></div>
                <div class="window-controls">
                    <button class="minimize"><i class="fas fa-minus"></i></button>
                    <button class="maximize"><i class="fas fa-square"></i></button>
                    <button class="close"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="window-content">
                <!-- Содержимое окна добавляется динамически -->
            </div>
            <div class="resize-handle"></div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
